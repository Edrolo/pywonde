# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: 'v0.0.282'  # Ruff version
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/grantjenks/blue
    rev: 'v0.9.1'
    hooks:
      - id: blue
        # Was pinned to python3.8, which is EOL and absent on current machines,
        # so the hook could not build its env at all. blue 0.9.1 runs fine on
        # modern Python, and the formatting target is inferred from the AST.
        language_version: python3

